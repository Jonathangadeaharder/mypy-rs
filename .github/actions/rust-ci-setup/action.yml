name: rust-ci-setup
description: >-
  Shared Rust prelude for CI jobs: install the stable toolchain (with
  optional components), record the rustc version for cache-key scoping,
  and warm the cargo registry (keyed on Cargo.lock alone). The jobs that
  build no Rust need none of this except when the native-extensions
  action rebuilds on an extension-cache miss.

inputs:
  components:
    description: >-
      Optional dtolnay/rust-toolchain components, e.g. "clippy, rustfmt".
    default: ""

outputs:
  version:
    description: Output of `rustc --version` with spaces and parens stripped.
    value: ${{ steps.rustc.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        components: ${{ inputs.components }}

    - name: Record Rust toolchain version
      id: rustc
      uses: ./.github/actions/rustc-version

    - name: Cache cargo registry
      # Registry sources are toolchain-independent: keyed on Cargo.lock
      # alone, so source edits stop re-saving the multi-GB registry.
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-registry-${{ runner.os }}-
