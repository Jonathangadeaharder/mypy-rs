name: native-extensions

# Build-once job for the three native extensions (#3): every workflow
# calls this via `uses:` as its build-extensions job, and the consuming
# jobs restore the same cache entry instead of rebuilding the crates.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency:` here on purpose: this is a reusable workflow, and any
# ref-keyed group would be evaluated against the caller's run, overriding
# callers like nightly that deliberately allow overlapping runs.

jobs:
  build-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Rust CI setup (toolchain + registry cache)
        uses: ./.github/actions/rust-ci-setup

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: Restore or build native extensions
        # This job owns the cargo-ext target/ entry: the action restores
        # it only on an extension-cache miss and saves it after the build.
        uses: ./.github/actions/native-extensions
        with:
          save-cache: "true"
          restore-target: "true"
          save-target: "true"
