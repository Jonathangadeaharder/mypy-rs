name: native-extensions

# Build-once job for the three native extensions (#3): every workflow
# calls this via `uses:` as its build-extensions job, and the consuming
# jobs restore the same cache entry instead of rebuilding the crates.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The group embeds github.workflow: it is this workflow's own name on
  # a direct dispatch, and the caller's name under workflow_call, so two
  # callers on one ref can never cancel each other's job.
  group: native-extensions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Record Rust toolchain version
        id: rustc
        uses: ./.github/actions/rustc-version

      - name: Cache cargo registry
        # Registry sources are toolchain-independent: keyed on Cargo.lock
        # alone, so source edits stop re-saving the multi-GB registry.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache cargo target dir (release extension build)
        # The consumer jobs (parity x5, merge-battery, full-battery) restore
        # this exact entry instead of caching target/ themselves.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          # Keyed on crate sources + toolchain (#3). Prefix fallback may
          # restore an older target/ (cargo rebuilds the delta); it stays
          # rustc-scoped, so a toolchain bump never reuses stale objects.
          key: cargo-ext-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: cargo-ext-${{ runner.os }}-${{ steps.rustc.outputs.version }}-

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: Restore or build native extensions
        uses: ./.github/actions/native-extensions
        with:
          save-cache: "true"
