name: native-kernel-parity

# Parity gates for the Rust type-kernel: jobs run the full testcheck corpus
# with TEST_NATIVE_TYPE_KERNEL=1 plus the Stage 3c resolvers (base resolvers
# install in mypy/test/conftest.py; expand_type installs in mypy/build.py).

# STATUS: gating, no continue-on-error. Pre-existing failures (issue #585)
# are deselected until fixed.

# env-var -> issue (conftest.py): base = Stage 3c subtype/join/mro/solve;
# TYPEOPS -> #203, CHECKER_STMTS -> #207, the M14 families -> #201.
# All jobs build type_kernel + ast_serialize + module_resolver for CI.

on:
  pull_request:
    branches: [main]
    paths:
      - crates/type_kernel/**
      - crates/ast_serialize/**
      - crates/module_resolver/**
      - mypyc/lib-rt/**
      - mypy/subtypes.py
      - mypy/join.py
      - mypy/argmap.py
      - mypy/erasetype.py
      - mypy/expandtype.py
      - mypy/applytype.py
      - mypy/mro.py
      - mypy/build.py
      - mypy/checker.py
      - mypy/semanal.py
      - mypy/test/conftest.py
      - mypy/checkexpr.py
      - mypy/solve.py
      - mypy/types.py
      - mypy/types_mirror.py
      - mypy/server/astdiff.py
      - mypy/symtable_access.py
      - mypy/symtables_mirror.py
      - mypy/test/testcheck.py
      - mypy/test/testtypes*.py
      - mypy/test/testdiff.py
      - mypy/test/testfinegrained.py
      - mypy/test/testfinegrainedcache.py
      - mypy/test/testdaemon.py
      - mypy/test/testinfer.py
      - mypy/nativeparse.py
      - mypy/fastparse.py
      - mypy/parse.py
      - mypy/cache_data.py
      - mypy/test/test_nativeparse.py
      - mypy/test/testparse.py
      - mypy/test/teststubgen.py
      - mypy/test/testcachedata.py
      - stubs/ast_serialize.pyi
      - .github/workflows/native-kernel-parity.yml
      - .github/workflows/native-extensions.yml
      - .github/actions/native-extensions/**
      - .github/actions/rustc-version/**
      - .github/actions/rust-ci-setup/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-kernel-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Per-job path gating (#1678): the workflow-level paths list is the outer
    # trigger, this narrows it so a kernel-only change skips the AST suite.
    # Fail-open by design: no SHAs or no diff means every job still runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ast: ${{ steps.filter.outputs.ast }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "no PR SHAs; running every parity job"
            echo "ast=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt 2>/dev/null; then
            if git fetch --no-tags --quiet origin "$BASE" 2>/dev/null; then
              echo "fetched $BASE for diff retry"
            else
              echo "fetch of $BASE failed" >&2
            fi
            if ! git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt 2>/dev/null; then
              echo "diff unavailable after fetch; running every parity job"
              echo "ast=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed files:"; cat /tmp/changed.txt
          ast=false
          while IFS= read -r f || [ -n "$f" ]; do
            case "$f" in
              .github/workflows/native-kernel-parity.yml) ast=true ;;
              .github/workflows/native-extensions.yml) ast=true ;;
              .github/actions/native-extensions/*) ast=true ;;
              .github/actions/rustc-version/*) ast=true ;;
              .github/actions/rust-ci-setup/*) ast=true ;;
              crates/ast_serialize/*) ast=true ;;
              stubs/ast_serialize.pyi) ast=true ;;
              mypy/nativeparse.py|mypy/fastparse.py|mypy/parse.py) ast=true ;;
              mypy/nodes.py|mypy/errors.py|mypy/options.py) ast=true ;;
              mypy/stubgen.py|mypy/stubutil.py) ast=true ;;
              mypy/semanal.py) ast=true ;;
              mypy/semanal_*.py) ast=true ;;
              mypy/test/conftest.py) ast=true ;;
              mypy/test/test_nativeparse.py) ast=true ;;
              mypy/test/testparse.py) ast=true ;;
              mypy/test/teststubgen.py) ast=true ;;
            esac
          done < /tmp/changed.txt
          echo "ast=$ast" >> "$GITHUB_OUTPUT"

  build-extensions:
    # Build the three native extensions once (#3); the parity jobs below
    # restore the cache entry instead of rebuilding the crates.
    uses: ./.github/workflows/native-extensions.yml

  parity:
    needs: build-extensions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Rust CI setup (toolchain + registry cache)
        uses: ./.github/actions/rust-ci-setup

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: Restore native extensions (built once by build-extensions)
        uses: ./.github/actions/native-extensions
        with:
          restore-target: "true"

      - name: Build in-repo librt (F3 wire cache)
        # PyPI librt (>=0.12.0) omits write_raw_bytes, so the F3 wire-cache
        # splice stays inert and NativeMirrorSpliceSuite self-skips. Build
        # the in-repo lib-rt; the PyPI wheel remains the fallback.
        run: |
          LIBSO=/tmp/librt-ext
          mkdir -p "$LIBSO"
          (cd mypyc/lib-rt && uv run python setup.py build_ext \
            --build-lib "$LIBSO" --build-temp /tmp/librt-build)
          PYTHONPATH="$LIBSO" uv run python -c "from librt.internal import write_raw_bytes; print('in-repo librt: write_raw_bytes OK')"
          echo "LIBRT_SCRATCH=$LIBSO" >> "$GITHUB_ENV"

      - name: Parity testcheck (resolvers installed)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_PARSER: "1"
          TEST_NATIVE_RESOLVER: "1"
          MYPY_NATIVE_PARITY_INSTALL_RESOLVERS: "1"
          MYPY_NATIVE_PARITY_INSTALL_TYPEOPS_RESOLVERS: "1"
          MYPY_NATIVE_PARITY_INSTALL_CHECKER_STMTS: "1"
          MYPY_NATIVE_PARITY_INSTALL_SEMANAL_VISITOR: "1"
          MYPY_ENABLE_NATIVE_SEMANAL: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: uv run python -m pytest mypy/test/testcheck.py -q -k "not slow" --timeout=30 --timeout-method=thread

      - name: Parity solve_one (testinfer)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          MYPY_NATIVE_PARITY_INSTALL_RESOLVERS: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: uv run python -m pytest mypy/test/testinfer.py -q --timeout=30 --timeout-method=thread

      # Reversed-order combined run (#336): testcheck before testtypes in one
      # xdist invocation shares workers, so a native-gate global leak shows
      # as ~17-25 failures; the conftest hook restores the snapshot per test.
      - name: Parity reversed-order isolation (testcheck+testtypes, #336)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_PARSER: "1"
          TEST_NATIVE_RESOLVER: "1"
          MYPY_NATIVE_PARITY_INSTALL_RESOLVERS: "1"
          MYPY_NATIVE_PARITY_INSTALL_TYPEOPS_RESOLVERS: "1"
          MYPY_NATIVE_PARITY_INSTALL_CHECKER_STMTS: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: |
          uv run python -m pytest mypy/test/testcheck.py mypy/test/testtypes*.py -q -k "not slow" -n4 --timeout=30 --timeout-method=thread

  parity-mirror:
    needs: build-extensions
    # F1/F2 mirror coverage (#1527): TEST_NATIVE_TYPE_MIRROR never ran in
    # CI. Capture + read flip exercise testtypes, testcheck, and the
    # fine-grained path (testcheck alone misses mirror identity cases).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Rust CI setup (toolchain + registry cache)
        uses: ./.github/actions/rust-ci-setup

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: Restore native extensions (built once by build-extensions)
        uses: ./.github/actions/native-extensions
        with:
          restore-target: "true"

      - name: Build in-repo librt (F3 wire cache)
        # Same as the parity job: the PyPI wheel omits write_raw_bytes and
        # the splice suite self-skips. Prepend the in-repo build so the
        # capture/read mirror runs exercise the wire cache for real.
        run: |
          LIBSO=/tmp/librt-ext
          mkdir -p "$LIBSO"
          (cd mypyc/lib-rt && uv run python setup.py build_ext \
            --build-lib "$LIBSO" --build-temp /tmp/librt-build)
          PYTHONPATH="$LIBSO" uv run python -c "from librt.internal import write_raw_bytes; print('in-repo librt: write_raw_bytes OK')"
          echo "LIBRT_SCRATCH=$LIBSO" >> "$GITHUB_ENV"

      - name: Mirror capture testtypes
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_TYPE_MIRROR: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: uv run python -m pytest mypy/test/testtypes*.py -q -n4 --timeout=30 --timeout-method=thread

      - name: Mirror capture+read testcheck
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_TYPE_MIRROR: "1"
          TEST_NATIVE_TYPE_MIRROR_READ: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        # The two #1530 stale-blob cases (testVariadicStarArgsCallNoCrash and
        # testRevealBoundParamSpecArgs) are re-enabled: raw-list mutators call
        # types_mirror.touch and the read flip re-verifies on the moved epoch.
        run: |
          uv run python -m pytest mypy/test/testcheck.py -q -n4 \
            -k "not slow" \
            --timeout=30 --timeout-method=thread

      - name: Mirror capture+read fine-grained
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_TYPE_MIRROR: "1"
          TEST_NATIVE_TYPE_MIRROR_READ: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: uv run python -m pytest mypy/test/testfinegrained.py -q -n4 --timeout=30 --timeout-method=thread

  parity-symtable-flip:
    needs: build-extensions
    # G3.1 (#1670): the namespace shadow's read flip, and the first CI run
    # of the symbol-table store (G3.0a shipped capture-only without one).
    # VERIFY serves every mirrored snapshot and diffs it against flip-off.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Rust CI setup (toolchain + registry cache)
        uses: ./.github/actions/rust-ci-setup

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: Restore native extensions (built once by build-extensions)
        # The daemon and fine-grained suites force native_parser on, and
        # pyproject.toml declares the PyPI ast-serialize stub, so without
        # these builds the suite dies on a parse() TypeError, not the flip.
        uses: ./.github/actions/native-extensions
        with:
          restore-target: "true"

      - name: Build in-repo librt (F3 wire cache)
        # Same as the parity job: the PyPI wheel omits write_raw_bytes, so
        # the wire-cache splice stays inert and the mirror suites skip it.
        run: |
          LIBSO=/tmp/librt-ext
          mkdir -p "$LIBSO"
          (cd mypyc/lib-rt && uv run python setup.py build_ext \
            --build-lib "$LIBSO" --build-temp /tmp/librt-build)
          PYTHONPATH="$LIBSO" uv run python -c "from librt.internal import write_raw_bytes; print('in-repo librt: write_raw_bytes OK')"
          echo "LIBRT_SCRATCH=$LIBSO" >> "$GITHUB_ENV"

      - name: Shadow + read-flip verify (seam suite)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_SYMTABLE_MIRROR: "1"
          TEST_NATIVE_SYMTABLE_READ_FLIP_VERIFY: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: |
          uv run python -m pytest mypy/test/testtypes*.py -q -n4 \
            -k "Symtable or AstdiffSymbol" --timeout=30 --timeout-method=thread

      - name: Read-flip differential (astdiff + cache data)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_SYMTABLE_MIRROR: "1"
          TEST_NATIVE_SYMTABLE_READ_FLIP_VERIFY: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
          # #1765: `{pid}` expands per xdist worker, so every process that
          # builds writes its own cumulative session dump.
          MYPY_TK_SYMTABLE_SESSIONFINISH_OUT: ${{ runner.temp }}/symtable-flip-{pid}.json
        run: |
          uv run python -m pytest mypy/test/testdiff.py mypy/test/testcachedata.py -q -n4 \
            --timeout=120 --timeout-method=thread
          # The suites assert engagement themselves; this is the step-level
          # evidence, so the leg cannot pass with the flip switched off.
          uv run python misc/symtable_flip_report.py '${{ runner.temp }}/symtable-flip-*.json'

      - name: Read-flip differential (fine-grained + daemon)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_SYMTABLE_MIRROR: "1"
          TEST_NATIVE_SYMTABLE_READ_FLIP_VERIFY: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: |
          uv run python -m pytest mypy/test/testfinegrained.py mypy/test/testfinegrainedcache.py \
            mypy/test/testdaemon.py -q -n4 --timeout=120 --timeout-method=thread

  parity-typeops:
    needs: build-extensions
    # Gating: typeops graduation (#203, M16) shipped; the truthiness fix
    # (#201) landed and the typeops corpus passes. Keep green before merging.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Rust CI setup (toolchain + registry cache)
        uses: ./.github/actions/rust-ci-setup

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: Restore native extensions (built once by build-extensions)
        uses: ./.github/actions/native-extensions
        with:
          restore-target: "true"

      - name: Parity testcheck (typeops resolvers installed)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
          TEST_NATIVE_PARSER: "1"
          TEST_NATIVE_RESOLVER: "1"
          MYPY_NATIVE_PARITY_INSTALL_RESOLVERS: "1"
          MYPY_NATIVE_PARITY_INSTALL_TYPEOPS_RESOLVERS: "1"
          MYPY_NATIVE_TYPE_KERNEL_REQUIRED: "1"
        run: uv run python -m pytest mypy/test/testcheck.py -q -k "not slow" --timeout=30 --timeout-method=thread

  parity-ast:
    # G0.2 (#1546): the AST path (test_nativeparse / testparse /
    # teststubgen) ran in no workflow. teststubgen always parses natively:
    # stubgen builds its own Options and ignores TEST_NATIVE_PARSER.
    needs: [changes, build-extensions]
    if: needs.changes.outputs.ast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Rust CI setup (toolchain + registry cache)
        uses: ./.github/actions/rust-ci-setup

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: Restore native extensions (built once by build-extensions)
        # teststubgen always parses natively: stubgen builds its own Options
        # and ignores TEST_NATIVE_PARSER, so ast_serialize must be present.
        uses: ./.github/actions/native-extensions
        with:
          restore-target: "true"

      - name: AST parity (native parser)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_PARSER: "1"
        run: uv run python -m pytest mypy/test/test_nativeparse.py mypy/test/testparse.py mypy/test/teststubgen.py -q -n4 --timeout=30 --timeout-method=thread

      - name: Cache data writer parity (G0.5)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
        run: uv run python -m pytest mypy/test/testcachedata.py -q -n4 --timeout=120 --timeout-method=thread

      - name: AST fastparse differential (Python parser)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_PARSER: "0"
        run: uv run python -m pytest mypy/test/testparse.py -q -n4 --timeout=30 --timeout-method=thread
