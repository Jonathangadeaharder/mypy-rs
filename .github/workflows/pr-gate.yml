name: pr-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extensions:
    # Build the three native extensions once (#3); the pr-gate job below
    # restores the cache entry instead of rebuilding the crates.
    uses: ./.github/workflows/native-extensions.yml

  pr-gate:
    needs: build-extensions
    runs-on: ubuntu-latest
    # Heaviest PR job (cargo build + clippy + cargo tests + self-check +
    # parity suites): ~3 min fully warm, far longer on a cold cargo cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Rust CI setup (toolchain + registry cache)
        id: rustc
        uses: ./.github/actions/rust-ci-setup
        with:
          components: "clippy, rustfmt"

      - name: Cache cargo target dir (debug workspace build)
        # This job owns the debug cargo-target entry, so it keeps the
        # save-capable actions/cache (#104): consumers restore-only.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          # Keyed on crate sources + toolchain (#3). Prefix fallback may
          # restore an older target/ (cargo rebuilds the delta); it stays
          # rustc-scoped, so a toolchain bump never reuses stale objects.
          key: cargo-target-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'crates/**/*.rs') }}
          # The cargo-ext prefix stays (unlike nightly rust-workspace,
          # #104): this job calls the native-extensions action, whose
          # release rebuild on an extension miss reuses that target/.
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ steps.rustc.outputs.version }}-
            cargo-ext-${{ runner.os }}-${{ steps.rustc.outputs.version }}-

      - name: Sync Python deps (uv)
        run: uv sync --group test

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo fmt --check (type_kernel)
        run: cargo fmt -p mypy-type-kernel -- --check

      - name: cargo clippy (type_kernel lib)
        run: cargo clippy -p mypy-type-kernel --lib -- -D warnings

      - name: cargo test (pure-Rust type_kernel suites)
        run: |
          # treetransform tests import mypy.nodes (+ deps) at cargo-test time;
          # the pyo3-embedded interpreter must see the repo root and the uv
          # venv's site-packages, and link against the venv python.
          SITE=$(uv run python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          PYO3_PYTHON=$(uv run python -c "import sys; print(sys.executable)") \
          PYTHONPATH="$GITHUB_WORKSPACE:$SITE" cargo test -p mypy-type-kernel

      - name: cargo fmt --check (ast_serialize)
        run: cargo fmt -p mypy-ast-serialize -- --check

      - name: cargo clippy (ast_serialize lib)
        run: cargo clippy -p mypy-ast-serialize --lib -- -D warnings

      - name: cargo test (ast_serialize suites)
        run: |
          PYO3_PYTHON=$(uv run python -c "import sys; print(sys.executable)") \
          cargo test -p mypy-ast-serialize

      # The skel bin is `required-features = ["skel"]`, so `cargo build
      # --workspace` skips it; without these the crate and its gate
      # tests could rot with every gate green (#95).
      - name: cargo fmt --check (mypy-rs-skel)
        run: cargo fmt -p mypy-rs-skel -- --check

      # --all-targets also compiles tests/gates.rs, which the bare
      # `cargo check`/`clippy` skip (integration tests are a separate
      # target), so a broken gate test fails here instead of rotting.
      - name: cargo clippy (mypy-rs-skel)
        run: cargo clippy -p mypy-rs-skel --features skel --all-targets -- -D warnings

      - name: cargo check (mypy-rs-skel)
        run: cargo check -p mypy-rs-skel --features skel --all-targets --locked

      # Runs the gate tests (1 differential, 3 seam count, 4 cache
      # isolation; gate 2 is macOS-only and compiles away here).
      - name: cargo test (mypy-rs-skel gates)
        run: cargo test -p mypy-rs-skel --features skel --locked

      - name: Restore native extensions (built once by build-extensions)
        # Self-check (num_workers=4) forces native_parser/native_resolver
        # on, so those extensions must be importable for the local gate to
        # be reproduced.
        uses: ./.github/actions/native-extensions

      - name: Build in-repo librt (F3 wire cache)
        # PyPI librt (>=0.12.0) omits write_raw_bytes, so the F3 wire-cache
        # splice stays inert. Build the in-repo lib-rt and prepend it; the
        # PyPI wheel remains the fallback. See AGENTS.md "librt build order".
        run: |
          LIBSO=/tmp/librt-ext
          mkdir -p "$LIBSO"
          (cd mypyc/lib-rt && uv run python setup.py build_ext \
            --build-lib "$LIBSO" --build-temp /tmp/librt-build)
          PYTHONPATH="$LIBSO" uv run python -c "from librt.internal import write_raw_bytes; print('in-repo librt: write_raw_bytes OK')"
          echo "LIBRT_SCRATCH=$LIBSO" >> "$GITHUB_ENV"

      - name: Self-check (mypy_self_check.ini)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
        run: uv run python -m mypy --config-file mypy_self_check.ini -p mypy -p mypyc

      - name: Python parity (NativeTypeWire + Resolver suites)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
        run: uv run python -m pytest mypy/test/testtypes*.py -q

      - name: Test collection guard (#1701)
        run: uv run python -m pytest mypy/test/testutil.py -q

      - name: Python subtypes baseline (pre-Stage-3c)
        run: uv run python -m pytest mypy/test/testsubtypes.py -q

      - name: Python check_call argmap parity (native-on)
        env:
          PYTHONPATH: ${{ env.LIBRT_SCRATCH }}:${{ env.SCRATCH }}
          TEST_NATIVE_TYPE_KERNEL: "1"
        run: uv run python -m pytest mypy/test/testinfer.py -q

      - name: Python check_call argmap baseline (native-off)
        run: uv run python -m pytest mypy/test/testinfer.py -q

      - name: Skeleton fixture freshness (#91)
        # Fail when committed fixtures are stale; MYPY_RS_EXT_DIRS points
        # the in-process build and regen subprocess at the restored cache;
        # the step bound stops a hung regeneration holding the job window.
        timeout-minutes: 15
        env:
          MYPY_RS_EXT_DIRS: ${{ env.SCRATCH }}
        run: uv run python misc/skeleton_codegen.py --check

  # Lint gate for NEW drift only: main carries 572 pre-existing ruff findings
  # and 45 black-dirty files (#1742), so the pinned tools run on the files the
  # PR touches instead of the tree. Touching a dirty file means cleaning it.
  lint-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0 keeps the PR merge base reachable for the diff below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "0.11.14"

      - name: Lint changed Python files (ruff 0.14.3 + black 26.1.0)
        env:
          # Empty on workflow_dispatch, which has no pull-request base.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.py' \
              > /tmp/lint-files.txt
          else
            git ls-files -- '*.py' > /tmp/lint-files.txt
          fi
          FILES=()
          while IFS= read -r path; do
            FILES+=("$path")
          done < /tmp/lint-files.txt
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files; lint gate skipped."
            exit 0
          fi
          printf 'linting %d changed file(s)\n' "${#FILES[@]}"
          printf '%s\n' "${FILES[@]}"
          # --no-fix is required: pyproject.toml sets fix = true, so a bare
          # `ruff check` rewrites the checkout and then exits 0.
          uvx ruff@0.14.3 check --no-fix --force-exclude "${FILES[@]}"
          # No --force-exclude here: pyproject's black force-exclude already
          # applies to explicit paths, and the flag turns an all-excluded list
          # into a usage error instead of a clean skip.
          uvx black@26.1.0 --check "${FILES[@]}"

      - name: G1.2 audit tables (verdict-only drift gate)
        # Source-tree only: python3 over git-tracked sources, no kernel, no
        # corpus, no external scanner (#1802). Line anchors are normalised out
        # of both sides, so this fires on verdict/served-as change (#1796).
        run: |
          python3 misc/g12_node_shadow_audit.py --check \
            docs/plans/2026-09-15-g12-node-shadow-fidelity-audit.md
