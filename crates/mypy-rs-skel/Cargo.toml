[package]
name = "mypy-rs-skel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone-skeleton crate (issue #91, ADR-0008 Lane 2). Never in a
# wheel, never in the production check path: the only target is the
# bin below, gated behind `skel` so no default build ever produces it.

[[bin]]
name = "mypy-rs"
path = "src/main.rs"
required-features = ["skel"]

[features]
skel = [
    "dep:mypy-type-kernel",
    "dep:pyo3-ffi",
    "dep:ruff_python_ast",
    "dep:ruff_python_parser",
    "dep:ruff_text_size",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
mypy-type-kernel = { path = "../type_kernel", optional = true, features = ["extension-module"] }
# Same pyo3 minor pin as the sibling crates (pyo3 pins pyo3-ffi `=0.20.x`
# exactly, so drifting ahead forks the family into two copies). abi3 is
# declared here rather than inherited via mypy-type-kernel's pyo3 edge.
pyo3-ffi = { version = "0.20.2", optional = true, features = ["abi3"] }
ruff_python_ast = { version = "0.0.3", optional = true }
ruff_python_parser = { version = "0.0.3", optional = true }
ruff_text_size = { version = "0.0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
